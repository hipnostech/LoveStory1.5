<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Campo das Estrelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg:#05070f;
  --ui-bg:rgba(12,16,34,.42);
  --ui-bg-hover:rgba(24,30,58,.62);
  --ui-border:rgba(255,255,255,.16);
  --fg:#eef1ff;
  --dim:rgba(238,241,255,.66);
  --gold:#ffdca3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none}

/* botões de vidro */
.btn{position:fixed;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:var(--ui-bg);border:1px solid var(--ui-border);color:var(--fg);cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .5s,background .2s,transform .2s;z-index:20}
.btn:hover{background:var(--ui-bg-hover)}
.btn:active{transform:scale(.94)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{opacity:0!important;pointer-events:none!important}

#fs{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;opacity:.55}
#fs:hover{opacity:1}
#mute{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));width:40px;height:40px;opacity:.55}
#mute:hover{opacity:1}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:inline}

/* dica inicial */
#hint{position:fixed;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));
  text-align:center;text-wrap:balance;font-size:17px;font-style:italic;letter-spacing:.02em;
  color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none;transition:opacity 1.6s;z-index:10;line-height:1.35}

/* joystick (só aparece enquanto o dedo está na tela) */
#joy{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);pointer-events:none;z-index:15;
  opacity:0;transition:opacity .2s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:rgba(255,255,255,.28);box-shadow:0 0 18px rgba(255,255,255,.25)}

/* ocular do telescópio */
#eyepiece{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1.4s ease;
  background:
    radial-gradient(circle closest-side at 50% 50%, transparent 86%, rgba(255,220,160,.10) 88.5%, rgba(0,0,0,.55) 90%, rgba(2,3,8,.96) 97%, #020308 100%);
  background-color:transparent}
#eyepiece.on{opacity:1}
#eyepiece::after{content:"";position:fixed;inset:0;background:#020308;
  -webkit-mask:radial-gradient(circle closest-side at 50% 50%, transparent 99.5%, #000 100%);
          mask:radial-gradient(circle closest-side at 50% 50%, transparent 99.5%, #000 100%)}

#scopeUI{position:fixed;inset:0;pointer-events:none;z-index:12;transition:opacity .8s}
#scopeUI > *{pointer-events:auto}
#close{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}
#nav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;align-items:center;gap:14px}
#nav .btn{position:static}
#count{min-width:56px;text-align:center;font-size:18px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 10px rgba(255,210,140,.5)}
#scopeHint{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);
  width:max-content;max-width:calc(100vw - 120px);text-align:center;font-style:italic;font-size:16px;color:var(--dim);
  pointer-events:none!important;transition:opacity 1.2s}

/* frases que aparecem no céu */
#whisper{position:fixed;left:16px;right:16px;top:calc(16% + env(safe-area-inset-top));text-align:center;
  font-style:italic;font-size:clamp(21px,4.6vw,30px);line-height:1.3;color:#fff5de;text-wrap:balance;
  text-shadow:0 0 14px rgba(0,0,0,.85),0 0 28px rgba(255,210,150,.35);
  opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease;pointer-events:none;z-index:9}
#whisper.quick{transition:opacity .35s ease,transform .35s ease}
#whisper.on{opacity:1;transform:none}

/* botão sentar/levantar */
.pill{position:fixed;height:40px;padding:0 16px;border-radius:20px;background:var(--ui-bg);border:1px solid var(--ui-border);
  color:var(--fg);font:italic 500 17px "Cormorant Garamond",Georgia,serif;letter-spacing:.03em;cursor:pointer;z-index:20;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:.7;transition:opacity .5s,background .2s}
.pill:hover{opacity:1;background:var(--ui-bg-hover)}
#sit{top:calc(14px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right))}

/* abas do telescópio */
#tabs{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:4px;padding:4px;
  border-radius:22px;background:var(--ui-bg);border:1px solid var(--ui-border);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tab{height:32px;padding:0 13px;border-radius:16px;border:0;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap;
  font:italic 500 16.5px "Cormorant Garamond",Georgia,serif}
.tab.on{background:rgba(255,220,163,.16);color:var(--gold)}
#cosmos{position:fixed;left:16px;right:16px;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;
  font-style:italic;font-size:clamp(18px,4.2vw,23px);line-height:1.5;color:#f4efff;text-wrap:balance;
  text-shadow:0 0 10px rgba(0,0,0,.95),0 0 24px rgba(130,150,255,.35);pointer-events:none!important}
#cosmos span{display:block;opacity:0;transform:translateY(6px);transition:opacity 1.4s ease,transform 1.4s ease}
#cosmos.on span{opacity:1;transform:none}
#cosmos:not(.on) span{transition-delay:0s!important}

/* pergaminho do poema */
#poem{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:rgba(3,5,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .6s}
#poemScroll{width:min(580px,100%);max-height:calc(100dvh - 110px);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text;
  padding:44px 40px 36px;border-radius:6px;color:#3b2a1a;
  background:radial-gradient(ellipse at 50% 40%,#f7eed6 0%,#efe2c0 55%,#dcc89a 100%);
  box-shadow:0 0 0 1px rgba(120,80,30,.35),inset 0 0 60px rgba(120,80,30,.28),0 20px 60px rgba(0,0,0,.6);
  font-style:italic;font-size:20px;line-height:1.6}
#poemScroll h1{font-style:normal;font-weight:500;font-size:30px;line-height:1.2;text-align:center;color:#5a1b22;margin-bottom:6px}
#poemScroll .orn{text-align:center;color:#8a6a3a;margin-bottom:26px;letter-spacing:.4em}
#poemScroll p{margin-bottom:1.15em}
#poemScroll p:first-of-type::first-letter{float:left;font-style:normal;font-size:3.1em;line-height:.9;padding:4px 8px 0 0;color:#7a1f2a}
#poemScroll .end{text-align:center;color:#7a1f2a;font-size:22px;margin-top:10px}
#poemClose{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}
@media (max-width:520px){ #poemScroll{padding:32px 24px 28px;font-size:18.5px} #poemScroll h1{font-size:26px} }

/* desejo */
#wish{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:16px;background:rgba(3,5,12,.6);transition:opacity .4s}
#wish .box{width:min(420px,100%);padding:26px 24px 20px;border-radius:8px;color:#3b2a1a;font-style:italic;
  background:radial-gradient(ellipse at 50% 40%,#f7eed6 0%,#efe2c0 60%,#dcc89a 100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
#wish .t{text-align:center;font-size:22px;color:#7a1f2a;margin-bottom:12px}
#wishText{width:100%;min-height:90px;resize:none;border:0;border-bottom:1px solid rgba(90,50,20,.35);background:transparent;outline:none;
  font:italic 19px "Cormorant Garamond",Georgia,serif;color:#3b2a1a;-webkit-user-select:text;user-select:text;touch-action:auto}
#wish .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#wish button{height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(90,50,20,.3);background:transparent;color:#5a3a20;font:italic 17px "Cormorant Garamond",Georgia,serif;cursor:pointer}
#wish button.gold{background:#7a1f2a;color:#f7e6c0;border-color:#7a1f2a}

/* foto ampliada */
#lightbox{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:rgba(3,5,12,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .45s}
#lightbox img{max-width:min(92vw,1100px);max-height:calc(100dvh - 150px);border-radius:10px;
  box-shadow:0 0 0 1px rgba(255,220,160,.25),0 0 60px rgba(255,210,150,.18);transition:opacity .3s, transform .3s}
#lbClose{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}
#lbNav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:14px;align-items:center}
#lbNav .btn{position:static}

/* véu de entrada */
#veil{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;transition:opacity 2.4s ease}
#veil span{font-size:34px;color:var(--gold);animation:pulse 1.6s ease-in-out infinite;text-shadow:0 0 18px rgba(255,210,140,.7)}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:20px;z-index:50;background:var(--bg)}
</style>
</head>
<body>
<div id="veil"><span>✦</span></div>
<div id="err">Não foi possível iniciar o 3D neste navegador.<br>Tente abrir no Chrome ou Safari atualizados.</div>

<button id="fs" class="btn hidden" aria-label="Tela cheia">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<button id="mute" class="btn hidden" aria-label="Ligar ou desligar a música">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<div id="hint" class="hidden"></div>
<div id="whisper"></div>
<button id="sit" class="pill hidden">sentar</button>
<div id="joy"><div id="knob"></div></div>

<div id="eyepiece"></div>
<div id="scopeUI" class="hidden">
  <div id="scopeHint">toque na foto para ver maior</div>
  <div id="tabs">
    <button class="tab on" data-t="photos">nossas fotos</button>
    <button class="tab" data-t="galaxy">a galáxia</button>
  </div>
  <div id="cosmos"></div>
  <button id="close" class="btn" aria-label="Sair do telescópio">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="nav" class="navbox">
    <button id="prev" class="btn" aria-label="Estrela anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="count">1 / 5</div>
    <button id="next" class="btn" aria-label="Próxima estrela"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="poem" class="hidden">
  <div id="poemScroll"></div>
  <button id="poemClose" class="btn" aria-label="Fechar poema"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="wish" class="hidden"><div class="box">
  <div class="t">✦ um desejo para o fogo ✦</div>
  <textarea id="wishText" maxlength="160" placeholder="escreva aqui o seu desejo…"></textarea>
  <div class="row"><button id="wishCancel">agora não</button><button id="wishSend" class="gold">jogar no fogo</button></div>
</div></div>

<div id="lightbox" class="hidden">
  <img id="lbImg" alt="">
  <button id="lbClose" class="btn" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="lbNav">
    <button id="lbPrev" class="btn" aria-label="Foto anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="lbNext" class="btn" aria-label="Próxima foto"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const PHOTOS = /*__PHOTOS__*/[];
const MUSIC = /*__MUSIC__*/'';

/* ================================================================== *
 * ✎ TEXTOS — edite à vontade
 * ================================================================== */
const POEM_TITLE = 'Tudo o que o céu me contou';
const POEM = `Deixei a noite acesa neste campo
pra você caminhar devagarinho,
entre margaridas que o vento balança
como quem guarda flores no caminho.

A lua chegou cedo, curiosa,
querendo ver de perto o seu sorriso;
eu disse a ela: "espera, tenha calma,
pra tanta luz, coragem é preciso."

Porque você não chega de uma vez:
você acontece aos poucos, feito aurora,
e mesmo quando o dia já nasceu
eu fico te olhando, sem ir embora.

Escondi seus cachos no desenho da grama,
seus olhos no brilho mais bonito do céu,
sua risada no canto dos grilos
e o seu jeito em tudo o que é meu.

Tem um telescópio esperando por você,
apontado pro canto onde eu guardei
os pedaços mais bonitos da gente,
as horas em que eu mais te amei.

Se um dia alguém te perguntar
por que esse céu brilha tanto assim,
diz que as estrelas só estão tentando
brilhar do jeito que você brilha pra mim.

E se o mundo lá fora fizer barulho,
se o dia pesar mais do que devia,
volta aqui, onde a brisa ainda sopra
e cada flor guarda um pouco de alegria.

Pode colher uma flor, se quiser,
e desfolhar devagar, sem pressa alguma:
eu contei cada pétala antes de você chegar,
e todas terminam em "bem-me-quer".

Porque de tudo o que esse céu me contou,
de tudo o que a noite me fez entender,
a verdade mais simples e mais bonita
é que o meu lugar favorito é você.`;
const POEM_END = 'Eu te amo muito. Hoje, amanhã e em todas as noites estreladas. ✦';

const PHRASES = [
  'eu te amo muito',
  'você é a coisa mais bonita desse céu',
  'seu sorriso ilumina mais que a lua',
  'cada estrela aqui tem um pouquinho de você',
  'seus cachos são meu lugar favorito',
  'você é minha pessoa favorita no mundo inteiro',
  'eu escolheria você em todas as vidas',
  'seus olhos são a minha constelação preferida',
  'com você, tudo vira casa',
  'você é linda de um jeito que não cabe em palavras',
  'que sorte a minha ter você',
  'te amo mais do que existem margaridas nesse campo',
  'meu coração sorri quando você sorri',
  'você é poesia andando por aí',
  'a lua tem inveja do seu brilho',
  'sua risada é a minha música favorita',
  'você é meu sonho bom acordado',
  'nada é mais bonito que você',
  'eu te amo, hoje e sempre',
  'o universo acertou em cheio quando fez você',
];
const WISHES = [
  '✦ uma estrela cadente… fiz um pedido: você, pra sempre',
  '✦ pedi de novo a mesma coisa: você',
  '✦ todo pedido que eu faço tem o seu nome',
];
const CAT_NAMES = ['Sandy', 'Danilo'];
const SANDY_LINES = ['hmpf. só dessa vez.', 'prrr… não conta pra ninguém que eu gostei', 'mordidinha de amor 😼', 'tá, pode continuar… mas sem exagero'];
const SANDY_BRAVA = ['*tapinha na sua mão* 💢', 'chhhh! me deixa', 'hmpf! 😾', '*olhar de desprezo* (mas te ama)'];
const STORY_TITLE = 'A nossa fantasia real';
const STORY_AUTHOR = 'Nicolly Adler';
const STORY_TEXT = `Este livro ainda está sendo escrito…`;
const CAT_LINES = ['miau 💕', 'prrrr… prrrr…', 'miau! (tradução: eu também te amo)', 'ronron ronron 💤', 'miau? (mais carinho, por favor)'];
const SPELLS = ['✦ feitiço do amor eterno: lançado', '✦ feitiço: toda vez que você sorrir, uma estrela nasce', '✦ encantamento: meu coração é seu pra sempre', '✦ feitiço das flores: que nunca falte margarida no seu caminho'];
const CHEST_MSG = 'o maior tesouro deste castelo é você 💛';
const THRONE_MSG = '✦ todo castelo precisa da sua rainha';
const BED_MSG = 'o teto encantado mostra o céu… mas o mais bonito daqui é você';
const DRAGON_MSG = 'segura firme… o céu é todo nosso ✦';
const DAY_MSG = ['☀ bom dia, meu amor', '☾ a noite voltou só pra gente'];
const MIRROR_MSG = 'espelho, espelho meu… existe alguém mais linda do que eu? — não, meu bem. ninguém. ✦';
const BOX_MSG = '♪ brilha, brilha, estrelinha…';
const TOWER_MSG = '✦ subindo a escada da torre…';
const FAIRY_MSG = '✦ as fadas sussurram: ';

const GALAXY_POEM = [
  ['Existem bilhões de galáxias lá fora,', 'cada uma com bilhões de sóis acesos.', 'E no meio de todo esse infinito,', 'o universo deu um jeito de me levar até você.'],
  ['A luz que você vê agora', 'saiu dessa galáxia há milhões de anos,', 'atravessou o escuro, o frio, o nada,', 'só pra chegar a tempo de te encontrar.'],
  ['Eu entendo essa luz.', 'Eu também atravessaria qualquer distância,', 'qualquer silêncio, qualquer noite,', 'se no fim do caminho estivesse você.'],

  ['Que o cosmos continue girando devagar,', 'que as galáxias dancem a sua dança eterna —', 'eu já encontrei o centro do meu universo,', 'e ele tem o seu sorriso. ✦'],

/* ------------------------------------------------------------------ *
 * Qualidade conforme o aparelho
 * ------------------------------------------------------------------ */
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const LOW = isTouch || Math.min(screen.width, screen.height) < 700;
const Q = LOW
  ? { grass: 34000, seg: 3, patch: 56, daisies: 5000, stars: 2800, flies: 50, pr: 1.5, oct: 4 }
  : { grass: 80000, seg: 4, patch: 74, daisies: 10000, stars: 4500, flies: 90, pr: 2, oct: 5 };

/* ------------------------------------------------------------------ *
 * Mundo: relevo, trilha e utilidades
 * ------------------------------------------------------------------ */
const CASTLE = { x: -55.4, z: -101, y: 4.5, rot: 0.29 };
const DRAGON = { x: 26, z: -6, yaw: 1.97 };
const LAKE = { x: 40, z: 30, r: 9 }, TREE_E = { x: -24, z: 16 }, SWING = { x: 15, z: 13 }, MUSH = { x: -30, z: 2 };
const SUNDIAL = { x: -5, z: 7 }, WAND_SPOT = { x: -3.6, z: 1.6 };
const nearSpecial = (x, z, m) => [LAKE, TREE_E, SWING, MUSH, SUNDIAL, WAND_SPOT].some(q => Math.hypot(x - q.x, z - q.z) < (q.r || 0) + m);
const TELESCOPE = { x: 3.5, z: -3 };
const LANTERN = { x: 1.6, z: -1.6 };
const WINDMILL = { x: 78, z: -112 };
const SPAWN = { x: -1.2, z: 9 };
const BLANKET = { x: 8.5, z: 3 };
const LECTERN = { x: -7.5, z: -5 };
const BOUND = 175;

const ss = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
function terrainH(x, z) {
  const r = Math.hypot(x, z);
  let h = 1.6 * Math.sin(x * .031) * Math.cos(z * .027) + 0.8 * Math.sin(x * .071 + z * .053 + 1.3) + 0.35 * Math.sin(x * .17 - z * .13);
  h *= 0.3 + 0.7 * ss(6, 40, r);
  h += ss(170, 420, r) * (12 + 7 * Math.sin(Math.atan2(z, x) * 4 + 1));
  h -= 1.7 * (1 - ss(7, 12, Math.hypot(x - LAKE.x, z - LAKE.z)));
  const w = 1 - ss(34, 62, Math.hypot(x - CASTLE.x, z - CASTLE.z));
  return h + (CASTLE.y - h) * w;
}
const pathCenter = z => 0.58 * z + 8 * Math.sin(z * .035);
const pathDist = (x, z) => (z > 12 || z < -84) ? 1e9 : Math.abs(x - pathCenter(z)) * 0.86;

#define BX ${BLANKET.x.toFixed(1)}
#define BZ ${BLANKET.z.toFixed(1)}
float terrainH(vec2 p){
  float r=length(p);
  float h=1.6*sin(p.x*.031)*cos(p.y*.027)+0.8*sin(p.x*.071+p.y*.053+1.3)+0.35*sin(p.x*.17-p.y*.13);
  h*=0.3+0.7*smoothstep(6.,40.,r);
  h+=smoothstep(170.,420.,r)*(12.+7.*sin(atan(p.y,p.x)*4.+1.));
  h-=1.7*(1.-smoothstep(7.,12.,length(p-vec2(40.,30.))));
  return mix(h,CY,1.-smoothstep(34.,62.,length(p-vec2(CX,CZ))));
}
float pathMask(vec2 p){

  float d=abs(p.x-pc)*0.86;
  float m=1.-smoothstep(0.75,1.7,d);
  m*=1.-smoothstep(4.,12.,p.y);
  m*=smoothstep(-84.,-79.,p.y);

}

  g.save(); g.beginPath(); g.arc(128, 128, 94, 0, Math.PI * 2); g.clip();

}

const shooting = (() => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array([1, 1, 1, 0, 0, 0]), 3));
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  line.frustumCulled = false; line.visible = false; line.renderOrder = -7;
  skyGroup.add(line);
  const s = { line, t: 0, dur: 0, next: 6, a: new THREE.Vector3(), b: new THREE.Vector3() };
  return s;
})();
function updateShooting(dt) {
  const s = shooting;
  if (!s.line.visible) {
    s.next -= dt;
    if (s.next <= 0) {
      let az = rnd() * Math.PI * 2, el = 0.35 + rnd() * 0.6;
      const nearView = (mode === 'walk' || mode === 'fly') && Math.random() < 0.65;
      if (nearView) { // passa perto de onde a pessoa está olhando
        az = Math.atan2(-Math.cos(player.yaw), -Math.sin(player.yaw)) + (rnd() - .5) * 0.9;
        el = Math.min(Math.max(player.pitch, 0.25) + 0.12 + rnd() * 0.25, 1.35);
      }
      if (nearView && !overlayOpen() && Math.random() < 0.55) setTimeout(() => whisper(WISHES[Math.floor(Math.random() * WISHES.length)], 4.5), 700);
      s.a.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
      const az2 = az + (rnd() - .5) * 0.5, el2 = el - 0.18 - rnd() * 0.15;
      s.b.set(Math.cos(az2) * Math.cos(el2), Math.sin(el2), Math.sin(az2) * Math.cos(el2));
      s.t = 0; s.dur = 0.7 + rnd() * 0.5; s.line.visible = true;
    }
    return;
  }
  s.t += dt;
  const k = s.t / s.dur;
  if (k >= 1) { s.line.visible = false; s.next = player.pose === 'lie' ? 5 + rnd() * 8 : 9 + rnd() * 14; return; }
  const head = new THREE.Vector3().lerpVectors(s.a, s.b, Math.min(k * 1.2, 1)).normalize().multiplyScalar(880);
  const tail = new THREE.Vector3().lerpVectors(s.a, s.b, Math.max(k * 1.2 - 0.35, 0)).normalize().multiplyScalar(880);
  const p = s.line.geometry.attributes.position;
  p.setXYZ(0, head.x, head.y, head.z); p.setXYZ(1, tail.x, tail.y, tail.z); p.needsUpdate = true;
  const fade = Math.sin(Math.PI * k);
  const c = s.line.geometry.attributes.color; c.setXYZ(0, fade, fade, fade); c.needsUpdate = true;
}

function mountainRing(radius, hMin, hMax, topHex, baseHex, seed) {
  const r = mulberry32(seed), segs = 220;
  const ph = [r() * 6, r() * 6, r() * 6, r() * 6];
  const pos = [], col = [], idx = [];
  const top = new THREE.Color(topHex), base = new THREE.Color(baseHex);
  for (let i = 0; i <= segs; i++) {
    const a = i / segs * Math.PI * 2;
    let n = 0.5 + 0.28 * Math.sin(a * 3 + ph[0]) + 0.16 * Math.sin(a * 7 + ph[1]) + 0.1 * Math.sin(a * 17 + ph[2]) + 0.05 * Math.sin(a * 41 + ph[3]);
    const h = hMin + (hMax - hMin) * Math.max(0, n);
    const x = Math.cos(a) * radius, z = Math.sin(a) * radius;
    pos.push(x, h, z, x, -30, z);
    col.push(top.r, top.g, top.b, base.r, base.g, base.b);
    if (i < segs) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide }));
  return m;
}

    fragmentShader: GLSL_COMMON + /* glsl */`

        vec3 grass=mix(vec3(0.075,0.125,0.07),vec3(0.115,0.18,0.09),n1)*(0.8+0.25*n2+0.12*n3);
        float pm=pathMask(p);

        alb=mix(alb,vec3(0.075,0.1,0.085),smoothstep(200.,420.,length(p)));

        vec3 col=alb*light*1.2*mix(1.,3.,uDay);

const segColliders = [];
function collide(o, rad) {
  for (const c of colliders) {
    if (!c.r) continue;
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), min = c.r + rad;
    if (d < min && d > 1e-4) { o.x = c.x + dx / d * min; o.z = c.z + dz / d * min; }
  }
  for (const w of segColliders) {
    const abx = w.bx - w.ax, abz = w.bz - w.az;
    const t = clamp(((o.x - w.ax) * abx + (o.z - w.az) * abz) / (abx * abx + abz * abz), 0, 1);
    const px = w.ax + abx * t, pz = w.az + abz * t, dx = o.x - px, dz = o.z - pz, d = Math.hypot(dx, dz), min = w.r + rad;
    if (d < min && d > 1e-5) { o.x = px + dx / d * min; o.z = pz + dz / d * min; }
  }
}

      x = Math.cos(a) * rr + gauss() * spread * 0.5; y = Math.sin(a) * rr + gauss() * spread * 0.5; z = gauss() * 0.025 * GAL_R;
      const k = rr / GAL_R; c = warm.map((v, j) => v + (blue[j] - v) * Math.min(k * 1.3, 1));
      if (r2() < 0.04) c = pink;
    }
    pos.set([x, y, z], i * 3); col.set(c, i * 3);
    size[i] = 0.8 + Math.pow(r2(), 5) * 3.4;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const pts = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uZoom, uPR: { value: PR } },
    vertexShader: /* glsl */`
      attribute vec3 aColor; attribute float aSize; uniform float uZoom, uPR; varying vec3 vCol; varying float vA;
      void main(){ vCol=aColor; vA=mix(0.1,0.85,uZoom);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
        gl_PointSize=aSize*uPR*mix(0.5,1.7,uZoom); }`,
    fragmentShader: /* glsl */`
      varying vec3 vCol; varying float vA;
      void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,0.,d); gl_FragColor=vec4(vCol,a*a*vA); }`,
  }));
  pts.renderOrder = 1; pts.frustumCulled = false;
  galaxySpin.add(pts);
  const haze = new THREE.Mesh(new THREE.PlaneGeometry(GAL_R * 2.6, GAL_R * 2.6), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, side: THREE.DoubleSide,
    uniforms: { uZoom },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: /* glsl */`
      uniform float uZoom; varying vec2 vUv;
      void main(){ vec2 p=(vUv-.5)*2.; float r2=dot(p,p);
        vec3 c=vec3(1.,.82,.6)*exp(-r2*45.)*0.9+vec3(.55,.6,1.)*exp(-r2*5.)*0.16+vec3(.9,.5,.8)*exp(-r2*12.)*0.08;
        gl_FragColor=vec4(c*mix(0.25,1.,uZoom),1.); }`,
  }));
  haze.renderOrder = 0;
  tilt.add(haze);
  skyGroup.add(outer);
}

/* ------------------------------------------------------------------ *
 * Constelação das fotos (as estrelas no telescópio)
 * ------------------------------------------------------------------ */
const R_PHOTO = 400;
const LAYOUT = [[-24, 38], [-12, 30], [0, 41], [12, 31], [24, 39]]; // forma de "W"
const photoItems = [];
const SDBOX = `float sdBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }`;

async function buildPhotos() {
  const imgs = await Promise.all(PHOTOS.map(src => new Promise(res => {
    const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
  })));
  const pts = [];
  imgs.forEach((img, i) => {
    if (!img) return;
    const [az, el] = LAYOUT[i % LAYOUT.length];
    const d = dirFrom(az + CONST_CENTER.az, el);
    const aspect = img.naturalWidth / img.naturalHeight;
    const w = 26 * Math.sqrt(aspect), h = 26 / Math.sqrt(aspect);
    const grp = new THREE.Group();
    grp.position.copy(d).multiplyScalar(R_PHOTO);
    grp.lookAt(0, 0, 0);
    pts.push(grp.position.clone());

    const tex = new THREE.Texture(img);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.needsUpdate = true;

    const pad = 9;
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(w + pad * 2, h + pad * 2), new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      uniforms: { uSize: { value: new THREE.Vector2(w, h) }, uPad: { value: pad }, uZoom, uTime },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: SDBOX + /* glsl */`
        uniform vec2 uSize; uniform float uPad, uZoom, uTime; varying vec2 vUv;
        void main(){
          vec2 full=uSize+uPad*2.; vec2 p=(vUv-.5)*full;
          float d=sdBox(p,uSize*.5,1.2);
          float glow=exp(-max(d,0.)*0.45)*0.5;
          float rim=exp(-abs(d-0.3)*5.)*0.8;
          float edge=1.-smoothstep(uPad*0.55,uPad,d);
          float a=(glow+rim)*edge*smoothstep(0.35,0.9,uZoom)*(0.9+0.1*sin(uTime*1.7));
          gl_FragColor=vec4(1.,.85,.6,a);
        }`,
    }));
    glow.renderOrder = 3;
    const photo = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      uniforms: { uMap: { value: tex }, uSize: { value: new THREE.Vector2(w, h) }, uZoom },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: SDBOX + /* glsl */`
        uniform sampler2D uMap; uniform vec2 uSize; uniform float uZoom; varying vec2 vUv;
        void main(){
          vec2 p=(vUv-.5)*uSize; float d=sdBox(p,uSize*.5,1.2);
          float a=smoothstep(0.08,-0.08,d)*smoothstep(0.35,0.9,uZoom);
          gl_FragColor=vec4(texture2D(uMap,vUv).rgb,a);
        }`,
    }));
    photo.renderOrder = 4;
    photo.userData.index = i;
    const star = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      uniforms: { uZoom, uTime, uDay, uPhase: { value: i * 1.7 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: /* glsl */`
        uniform float uZoom, uTime, uPhase, uDay; varying vec2 vUv;
        void main(){
          vec2 p=(vUv-.5)*2.; float r=length(p);
          float core=exp(-r*r*70.)*1.4, halo=exp(-r*r*10.)*0.28;
          float spikes=(exp(-abs(p.x)*45.)*exp(-abs(p.y)*4.)+exp(-abs(p.y)*45.)*exp(-abs(p.x)*4.))*0.45;
          float tw=0.8+0.2*sin(uTime*2.2+uPhase);
          float a=(core+halo+spikes)*tw*(1.-smoothstep(0.15,0.7,uZoom))*(1.-uDay);
          gl_FragColor=vec4(1.,.94,.82,a);
        }`,
    }));
    star.position.z = 0.5; star.renderOrder = 5;
    grp.add(glow, photo, star);
    skyGroup.add(grp);
    photoItems.push({ index: i, dir: d, w, h, mesh: photo, src: PHOTOS[i] });
  });
  // linhas da constelação
  if (pts.length > 1) {
    const lg = new THREE.BufferGeometry().setFromPoints(pts);
    const lm = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, uniforms: { uZoom, uDay },
      vertexShader: `void main(){ gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: `uniform float uZoom, uDay; void main(){ gl_FragColor=vec4(.75,.82,1.,(0.045+0.3*smoothstep(0.2,0.8,uZoom))*(1.-uDay*(1.-uZoom))); }`,
    });
    const line = new THREE.Line(lg, lm); line.renderOrder = 2; line.frustumCulled = false;
    skyGroup.add(line);
  }
}

/* ponteiros: mouse, toque e joystick */
const canvas = renderer.domElement;
const joyEl = document.getElementById('joy'), knobEl = document.getElementById('knob');
const pointers = new Map();
let joyId = null, lookId = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture?.(e.pointerId);
  const p = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), type: e.pointerType };
  pointers.set(e.pointerId, p);
  if ((mode === 'walk' || mode === 'fly') && e.pointerType !== 'mouse' && e.clientX < innerWidth * 0.42 && joyId === null) {
    joyId = e.pointerId;
    joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px';
    joyEl.classList.add('on'); knobEl.style.transform = 'translate(0,0)';
  } else if (lookId === null) {
    lookId = e.pointerId;
  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) { if (e.pointerType === 'mouse') hoverCheck(e.clientX, e.clientY); return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (e.pointerId === joyId) {
    let vx = (e.clientX - p.sx) / 48, vy = (e.clientY - p.sy) / 48;
    const l = Math.hypot(vx, vy); if (l > 1) { vx /= l; vy /= l; }
    joy.x = vx; joy.y = -vy;
    knobEl.style.transform = `translate(${vx * 34}px,${vy * 34}px)`;
    markInteracted();
  } else if (e.pointerId === lookId && mode === 'fly') {
    const sens = e.pointerType === 'mouse' ? 0.004 : 0.006;
    fly.lookYaw -= dx * sens; fly.lookPitch = Math.max(-0.35, Math.min(1.0, fly.lookPitch + dy * sens)); fly.lookHold = 1.5;
  } else if (e.pointerId === lookId && (mode === 'walk' || mode === 'ride')) {
    const sens = e.pointerType === 'mouse' ? 0.0032 : 0.0052;
    player.yaw -= dx * sens;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - dy * sens));
    if (Math.hypot(p.x - p.sx, p.y - p.sy) > 12) markInteracted();
  }
});
function endPointer(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  const moved = Math.hypot(e.clientX - p.sx, e.clientY - p.sy), dt = performance.now() - p.t;
  if (e.pointerId === joyId) { joyId = null; joy.x = joy.y = 0; joyEl.classList.remove('on'); }
  if (e.pointerId === lookId) lookId = null;
  if (e.type === 'pointercancel') return;
  if (moved < 12 && dt < 450) handleTap(e.clientX, e.clientY);
  else if (mode === 'scope' && dt < 700 && Math.abs(e.clientX - p.sx) > 50 && Math.abs(e.clientX - p.sx) > Math.abs(e.clientY - p.sy)) {
    goTo(current + (e.clientX < p.sx ? 1 : -1));
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

function pick(x, y, objects) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  raycaster.far = 3000;
  return raycaster.intersectObjects(objects, false);
}
function tapHit(x, y) {
  const hs = pick(x, y, interactTargets()).filter(h => isShown(h.object));
  if (!hs.length) return null;
  const pr = h => h.object === held.hit ? 9 : (h.object.userData.inter ? (h.object.userData.inter.priority || 1) : 0);
  let ch = hs[0];
  for (const h of hs) { if (h.distance > hs[0].distance + 1.2) break; if (pr(h) > pr(ch)) ch = h; }
  return ch;
}
function handleTap(x, y) {
  if (mode === 'walk') {
    if (picking) return;
    const h = tapHit(x, y);
    if (h) {
      if (h.object === held.hit) { pluck(); return; }
      const it = h.object.userData.inter;
      if (it && h.distance < it.range) { it.action(h); return; }
      if (!it && h.distance < 30) return;
    }
    if (tryTapLantern(x, y)) return;
    if (!tryPickDaisy(x, y) && wand.held) castWand(x, y);
  } else if (mode === 'fly') { if (!tryTapLantern(x, y)) dragonBreath(); }
  else if (mode === 'scope' && scopeTarget === 'photos') {
    const hits = pick(x, y, photoItems.map(p => p.mesh));
    if (hits.length) openLightbox(hits[0].object.userData.index);
  }
}
let hoverPending = false;
function hoverCheck(x, y) {
  if (hoverPending) return; hoverPending = true;
  requestAnimationFrame(() => {
    hoverPending = false;
    let over = false;
    if (mode === 'walk') { const h = tapHit(x, y); over = !!(h && h.object.userData.inter && h.distance < h.object.userData.inter.range) || (h && h.object === held.hit); }
    else if (mode === 'scope') over = pick(x, y, photoItems.map(p => p.mesh)).length > 0;
    canvas.style.cursor = over ? 'pointer' : (mode === 'walk' ? 'grab' : 'default');
  });
}

function markInteracted() {
  if (interacted) return;
  interacted = true;
  setTimeout(() => hintEl.classList.add('hidden'), 2500);
}

/* ------------------------------------------------------------------ *
 * Telescópio: entrar, navegar, sair
 * ------------------------------------------------------------------ */
const eyepieceEl = document.getElementById('eyepiece');
const scopeUI = document.getElementById('scopeUI');
const scopeHint = document.getElementById('scopeHint');
const countEl = document.getElementById('count');
const fsBtn = document.getElementById('fs');
const tweens = [];
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function tween(dur, fn, ease = easeInOut) { return new Promise(res => tweens.push({ t: 0, dur, fn, ease, res })); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(tw.t / tw.dur, 1); tw.fn(tw.ease(k));
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
function anglesFor(dir) { return { yaw: Math.atan2(-dir.x, -dir.z), pitch: Math.asin(dir.y) }; }
function setFov(f) {
  camera.fov = f; camera.updateProjectionMatrix();
  uZoom.value = Math.min(Math.max((BASE_FOV - f) / (BASE_FOV - 25), 0), 1);
}
function fovForDiag(diag, dist) {
  const D = Math.min(innerWidth, innerHeight) * 0.84;
  return 2 * Math.atan(diag * innerHeight / (2 * dist * D)) / deg;
}
function fovFor(i) {
  const it = photoItems[i]; if (!it) return 12;
  return fovForDiag(Math.hypot(it.w, it.h) + 6, R_PHOTO);
}
let scopeTarget = 'photos';
function targetView() {
  if (scopeTarget === 'galaxy') return { dir: GALAXY_DIR, fov: fovForDiag(GAL_R * 2.3, R_GAL) };
  return { dir: photoItems[current].dir, fov: fovFor(current) };
}
const eyePoint = () => new THREE.Vector3(TELESCOPE.x, terrainH(TELESCOPE.x, TELESCOPE.z) + 1.62, TELESCOPE.z + 0.95);
let saved = null;
let scopeCam = null; // posição da câmera no modo telescópio
const navEl = document.getElementById('nav');
const tabBtns = [...document.querySelectorAll('.tab')];

async function enterScope() {
  if (mode !== 'walk' || !photoItems.length || picking) return;
  mode = 'busy'; markInteracted();
  hintEl.classList.add('hidden'); fsBtn.classList.add('hidden'); sitBtn.classList.add('hidden');
  whisperEl.classList.remove('on');
  joyId = null; joy.x = joy.y = 0; joyEl.classList.remove('on');
  canvas.style.cursor = 'default';
  if (player.seat) { player.seat.onStand?.(); player.seat = null; }
  player.pose = 'stand'; updateSitBtn();
  saved = { x: player.x, z: player.z, yaw: player.yaw, pitch: player.pitch };
  const p0 = camera.position.clone(), p1 = eyePoint();
  const y0 = player.yaw, pt0 = player.pitch;
  const tgt = anglesFor(targetView().dir);
  const dy = wrapAngle(tgt.yaw - y0);
  scopeCam = p0.clone();
  await tween(1.6, k => { scopeCam.lerpVectors(p0, p1, k); player.yaw = y0 + dy * k; player.pitch = pt0 + (tgt.pitch - pt0) * k; });
  eyepieceEl.classList.add('on');
  const f0 = camera.fov, f1 = targetView().fov;
  await tween(2.2, k => setFov(f0 + (f1 - f0) * k));
  mode = 'scope';
  updateScopeUI();
  scopeUI.classList.remove('hidden');
  if (scopeTarget === 'photos') {
    scopeHint.classList.remove('hidden');
    setTimeout(() => scopeHint.classList.add('hidden'), 4000);
  } else playCosmos();
}
let slewing = false;
async function slewTo(view, dur = 1.25, bump = 5) {
  slewing = true;
  const y0 = player.yaw, pt0 = player.pitch, f0 = camera.fov;
  const tgt = anglesFor(view.dir), f1 = view.fov;
  const dy = wrapAngle(tgt.yaw - y0);
  await tween(dur, k => {
    player.yaw = y0 + dy * k; player.pitch = pt0 + (tgt.pitch - pt0) * k;
    setFov(f0 + (f1 - f0) * k + Math.sin(Math.PI * k) * bump);
  });
  slewing = false;
}
async function goTo(i) {
  if (mode !== 'scope' || slewing || scopeTarget !== 'photos' || !photoItems.length) return;
  const n = photoItems.length;
  const next = ((i % n) + n) % n;
  if (next === current) return;
  current = next; updateScopeUI();
  await slewTo(targetView());
}
async function setScopeTarget(t) {
  if (mode !== 'scope' || slewing || t === scopeTarget) return;
  scopeTarget = t;
  stopCosmos(); scopeHint.classList.add('hidden');
  updateScopeUI();
  await slewTo(targetView(), 2.4, 28);
  if (scopeTarget === 'galaxy' && mode === 'scope') playCosmos();
}
async function exitScope() {
  if (mode !== 'scope') return;
  mode = 'busy';
  stopCosmos();
  scopeUI.classList.add('hidden');
  const f0 = camera.fov;
  eyepieceEl.classList.remove('on');
  await tween(1.4, k => setFov(f0 + (BASE_FOV - f0) * k));
  player.eyeH = EYE_H;
  const p0 = scopeCam.clone(), p1 = new THREE.Vector3(saved.x, terrainH(saved.x, saved.z) + EYE_H, saved.z);
  const y0 = player.yaw, pt0 = player.pitch, dy = wrapAngle(saved.yaw - y0), pt1 = 0.12;
  await tween(1.4, k => { scopeCam.lerpVectors(p0, p1, k); player.yaw = y0 + dy * k; player.pitch = pt0 + (pt1 - pt0) * k; });
  scopeCam = null; player.vx = player.vz = 0;
  mode = 'walk';
  fsBtn.classList.remove('hidden'); sitBtn.classList.remove('hidden');
  canvas.style.cursor = 'grab';
}
function updateScopeUI() {
  countEl.textContent = `${current + 1} / ${photoItems.length}`;
  navEl.classList.toggle('hidden', scopeTarget !== 'photos');
  tabBtns.forEach(b => b.classList.toggle('on', b.dataset.t === scopeTarget));
}
tabBtns.forEach(b => b.addEventListener('click', () => setScopeTarget(b.dataset.t)));

/* poema que aparece verso a verso na frente da galáxia */
const cosmosEl = document.getElementById('cosmos');
let cosmosToken = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
async function playCosmos() {
  const my = ++cosmosToken;
  for (let s = 0; my === cosmosToken; s = (s + 1) % GALAXY_POEM.length) {
    cosmosEl.replaceChildren(...GALAXY_POEM[s].map((line, i) => {
      const sp = document.createElement('span'); sp.textContent = line; sp.style.transitionDelay = `${i * 1.5}s`; return sp;
    }));
    await wait(80); if (my !== cosmosToken) return;
    cosmosEl.classList.add('on');
    await wait(GALAXY_POEM[s].length * 1500 + 6500); if (my !== cosmosToken) return;
    cosmosEl.classList.remove('on');
    await wait(1500);
  }
}
function stopCosmos() { cosmosToken++; cosmosEl.classList.remove('on'); }

function renderParchment(title, sub, text, endText) {
  const box = document.getElementById('poemScroll'); box.replaceChildren();

function nextPhrase() {

}
function updatePhrases(dt) {

function updateSitBtn() { sitBtn.textContent = mode === 'fly' ? 'pousar' : mode === 'ride' ? 'descer' : player.pose === 'stand' ? 'sentar' : 'levantar'; }

/* ------------------------------------------------------------------ *
 * Colher uma margarida e desfolhar: bem-me-quer, mal-me-quer…
 * ------------------------------------------------------------------ */
scene.add(camera); // a flor na mão é filha da câmera
let picking = false, pickedAny = false;
const held = { group: null, petals: [], hit: null, plucked: 0, appear: 0, scale: 1 };
const petalTex = (() => {
  const c = document.createElement('canvas'); c.width = 32; c.height = 128; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 128, 0, 0);
  grd.addColorStop(0, '#d5dae4'); grd.addColorStop(0.3, '#ffffff'); grd.addColorStop(1, '#f3f3f8');
  g.fillStyle = grd; g.beginPath(); g.ellipse(16, 64, 14, 62, 0, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const heldMat = (opts, order) => Object.assign(new THREE.MeshBasicMaterial({ depthTest: false, depthWrite: false, ...opts }), { userData: { order } });
function makeHeldFlower() {
  const root = new THREE.Group();
  const tilt = new THREE.Group(); tilt.rotation.x = -0.35; root.add(tilt);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.0032, 0.0042, 0.34, 6), heldMat({ color: 0x4d7a3f }));
  stem.position.y = -0.17; stem.renderOrder = 100; tilt.add(stem);
  const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.012, 0.05), heldMat({ color: 0x3f6b35, side: THREE.DoubleSide }));
  leaf.position.set(0.01, -0.2, 0); leaf.rotation.z = -0.8; leaf.renderOrder = 100; tilt.add(leaf);
  const head = new THREE.Group(); head.rotation.x = 1.25; tilt.add(head);
  const petalGeo = new THREE.PlaneGeometry(0.012, 0.042); petalGeo.translate(0, 0.03, 0); petalGeo.rotateX(-Math.PI / 2);
  const petalMat = heldMat({ map: petalTex, color: 0xe6ebf6, transparent: true, alphaTest: 0.4, side: THREE.DoubleSide });
  const N = [11, 13, 15][Math.floor(Math.random() * 3)]; // ímpar: sempre termina em bem-me-quer
  const petals = [];
  for (let i = 0; i < N; i++) {
    const pv = new THREE.Group(); pv.rotation.y = i / N * Math.PI * 2 + (Math.random() - .5) * 0.1; head.add(pv);
    const pt = new THREE.Mesh(petalGeo, petalMat); pt.rotation.x = 0.12 + Math.random() * 0.08; pt.renderOrder = 101; pv.add(pt);
    petals.push(pt);
  }
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.013, 14, 8), heldMat({ color: 0xf0bb2a }));
  center.scale.y = 0.45; center.renderOrder = 102; head.add(center);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), heldMat({ transparent: true, opacity: 0 }));
  head.add(hit);
  camera.add(root);
  Object.assign(held, { group: root, petals, hit, plucked: 0, appear: 0 });
}
function dropFlower() {
  const g = held.group; if (!g) return;
  Object.assign(held, { group: null, petals: [], hit: null });
  const s0 = g.scale.x, y0 = g.position.y;
  tween(0.6, k => { g.scale.setScalar(s0 * (1 - k) + 0.0001); g.position.y = y0 - 0.1 * k; }).then(() => camera.remove(g));
}
function pluck() {
  if (!held.group || !held.petals.length || mode !== 'walk') return;
  markInteracted();
  const p = held.petals.splice(Math.floor(Math.random() * held.petals.length), 1)[0];
  held.plucked++;
  const bem = held.plucked % 2 === 1;
  camera.updateMatrixWorld(true);
  camera.attach(p);
  p.material = p.material.clone(); p.material.alphaTest = 0.01;
  const st = p.position.clone(), drift = (Math.random() - .5) * 0.2;
  tween(1.6, k => {
    p.position.set(st.x + drift * k + Math.sin(k * 9) * 0.012, st.y - 0.38 * k * k - 0.02 * k, st.z + 0.04 * k);
    p.rotation.x += 0.07; p.rotation.z += 0.05; p.material.opacity = 1 - k;
  }, k => k).then(() => camera.remove(p));
  if (held.petals.length) whisper(bem ? 'bem-me-quer' : 'mal-me-quer', 1.5, true);
  else {
    whisper('bem-me-quer 🤍', 2, true);
    setTimeout(() => whisper('…e eu te amo muito, muito, muito', 5.5), 2300);
    setTimeout(dropFlower, 3500);
  }
}
function tryPickDaisy(x, y) {
  if (!DAISY || picking) return false;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const o = raycaster.ray.origin, d = raycaster.ray.direction;
  const { off, par, n, S, alive } = DAISY;
  let best = -1, bestA = 0.085;
  const wrap = (v, c) => ((v - c + S / 2) % S + S) % S - S / 2 + c;
  for (let i = 0; i < n; i++) {
    if (!alive.array[i]) continue;
    const px = wrap(off[i * 2], o.x), pz = wrap(off[i * 2 + 1], o.z);
    const dx = px - o.x, dz = pz - o.z;
    if (dx * dx + dz * dz > 36 || pathDist(px, pz) < 1.3) continue;
    const dy = terrainH(px, pz) + par[i * 4 + 1] - o.y;
    const t = dx * d.x + dy * d.y + dz * d.z;
    if (t < 0.2) continue;
    const perp = Math.sqrt(Math.max(dx * dx + dy * dy + dz * dz - t * t, 0));
    const a = perp / t;
    if (a < bestA) { bestA = a; best = i; }
  }
  if (best < 0) return false;
  pickDaisy(best);
  return true;
}
async function pickDaisy(i) {
  picking = true; pickedAny = true; markInteracted();
  if (held.group) dropFlower();
  const d0 = player.dip;
  await tween(0.45, k => { player.dip = d0 + (-0.5 - d0) * k; });
  DAISY.alive.array[i] = 0; DAISY.alive.needsUpdate = true;
  makeHeldFlower();
  await tween(0.6, k => { player.dip = -0.5 * (1 - k); held.appear = k; });
  picking = false;
  if (!pickFirstDone) {
    pickFirstDone = true;
    whisper(isTouch ? 'toque na flor para desfolhar…' : 'clique na flor (ou aperte F) para desfolhar…', 4, true);
  }
}
let pickFirstDone = false;
function updateHeld() {
  const g = held.group; if (!g) return;
  g.visible = mode === 'walk' && !overlayOpen();
  const halfH = 0.42 * Math.tan(BASE_FOV / 2 * deg), halfW = halfH * camera.aspect;
  held.scale = Math.min(1, Math.max(0.72, camera.aspect * 1.4));
  const sp = Math.hypot(player.vx, player.vz), t = uTime.value;
  g.position.set(
    Math.min(halfW * 0.5, 0.2) + Math.sin(t * 0.9) * 0.006,
    -halfH * 0.45 + (held.appear - 1) * 0.25 + Math.sin(player.bob * 3.8) * 0.006 * Math.min(sp / 4, 1),
    -0.42);
  g.rotation.set(0, -0.25, -0.12 + Math.sin(t * 1.3) * 0.035);
  g.scale.setScalar(Math.max(held.appear, 0.001) * held.scale);
}

/* ------------------------------------------------------------------ *
 * Movimento
 * ------------------------------------------------------------------ */
function updateWalk(dt) {
  let mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + joy.x;
  let mz = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) + joy.y;
  if (overlayOpen() || picking) mx = mz = 0;
  const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; }
  if (l > 0.05) { markInteracted(); if (player.pose !== 'stand') standUp(); }
  if (player.pose === 'seat') { placeCamera(); return; }
  const speed = keys['shift'] ? 8 : 4.3;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const tx = (-sy * mz + cy * mx) * speed, tz = (-cy * mz - sy * mx) * speed;
  const k = 1 - Math.exp(-dt * 8);
  player.vx += (tx - player.vx) * k; player.vz += (tz - player.vz) * k;
  player.x += player.vx * dt; player.z += player.vz * dt;
  collide(player, 0.35);
  const r = Math.hypot(player.x, player.z);
  if (r > BOUND) { player.x *= BOUND / r; player.z *= BOUND / r; }
  const tgtH = player.pose === 'lie' ? 0.42 : player.pose === 'sit' ? 0.9 : EYE_H;
  player.eyeH += (tgtH - player.eyeH) * (1 - Math.exp(-dt * 3.2));
  const sp = Math.hypot(player.vx, player.vz);
  player.bob += sp * dt;
  placeCamera(Math.sin(player.bob * 1.9) * 0.035 * Math.min(sp / 4, 1));
}
function placeCamera(bob = 0) {
  if (player.pose === 'seat' && player.seat) { camera.position.copy(player.seat.eye()); return; }
  camera.position.set(player.x, floorY(player.x, player.z) + player.eyeH + player.dip + bob, player.z);
}

/* ------------------------------------------------------------------ *
 * Loop
 * ------------------------------------------------------------------ */
function onResize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  if (mode === 'scope' && !slewing) setFov(targetView().fov); else camera.updateProjectionMatrix();
}

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  uTime.value += dt;
  updateTweens(dt);
  if (mode === 'walk') updateWalk(dt);
  else if (mode === 'fly') updateFly(dt);
  else if (mode === 'ride') updateRide(dt);
  else if (camDriver) camDriver(dt);
  else if (scopeCam) camera.position.copy(scopeCam);
  else placeCamera();
  camera.rotation.set(player.pitch, player.yaw, 0);
  uCam.value.copy(camera.position);
  skyGroup.position.copy(camera.position);

  const fl = 0.9 + 0.06 * Math.sin(uTime.value * 11) + 0.05 * Math.sin(uTime.value * 23.7 + 1.3);
  uFlicker.value = fl; lanternLight.intensity = 6 * fl; lanternGlow.material.opacity = 0.75 * fl;
  sparkle.visible = mode === 'walk';
  sparkle.position.y = terrainH(TELESCOPE.x, TELESCOPE.z) + 2.55 + Math.sin(uTime.value * 1.6) * 0.08;
  sparkle.material.opacity = 0.55 + 0.45 * Math.sin(uTime.value * 2.4);
  sparkle.material.rotation = uTime.value * 0.3;
  windmillBlades.rotation.z -= dt * 0.35;
  updateWorld2(dt);
  for (const f of flags) {
    const pa = f.mesh.geometry.attributes.position, b = f.base;
    for (let i = 0; i < pa.count; i++) {
      const x = b[i * 3];
      pa.array[i * 3 + 2] = Math.sin(x * 2.2 - uTime.value * 4 + f.phase) * 0.18 * x / 2.6;
    }
    pa.needsUpdate = true;
  }
  updateShooting(dt);
  for (const s of sparkles) {
    s.sprite.visible = mode === 'walk' && !(s.hideWhenLying && player.pose === 'lie');
    s.sprite.position.y = s.y + Math.sin(uTime.value * 1.6 + s.ph) * 0.07;
    s.sprite.material.opacity = 0.5 + 0.45 * Math.sin(uTime.value * 2.4 + s.ph);
    s.sprite.material.rotation = uTime.value * 0.3;
  }
  if (galaxySpin) galaxySpin.rotation.z += dt * 0.015;
  updateHeld();
  updatePhrases(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
